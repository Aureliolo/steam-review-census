name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Deliberately not --all-features: the cuda and metal backends need vendor toolchains
      # the runners do not have, and the default set is what actually ships.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The report's folding, filtering, sorting and deep links only exist once a browser has run
  # them, and so does its rendering: a stylesheet rule can flatten a chart or turn a printed
  # page into blocks of ink while the markup stays exactly right. Both are the one part of
  # this tool no Rust test can reach. The runner's own Chrome drives a page rendered from a
  # fixture, on screen and again under print media, needing no corpus and no model.
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p census-core --example sample-report -- report.html
      - run: node tools/report-check/check.mjs report.html
      # A report of one game has no cross-game matrix and no contents to come back to, so it
      # is a different page and gets driven too.
      - run: cargo run -p census-core --example sample-report -- one.html --one-game
      - run: node tools/report-check/check.mjs one.html
