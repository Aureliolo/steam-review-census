name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The desktop shell is Tauri, which links against the system webview. On Linux that is
      # WebKitGTK, and without it the workspace does not build at all: the failure is
      # `glib-sys` failing its build script, which names nothing about Tauri.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Deliberately not --all-features: the cuda and metal backends need vendor toolchains
      # the runners do not have, and the default set is what actually ships.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The report's folding, filtering, sorting and deep links only exist once a browser has run
  # them, and so does its rendering: a stylesheet rule can flatten a chart or turn a printed
  # page into blocks of ink while the markup stays exactly right. Both are the one part of
  # this tool no Rust test can reach. The runner's own Chrome drives a page rendered from a
  # fixture, on screen and again under print media, needing no corpus and no model.
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # No system webview needed here: the example lives in the core crate, which is the
      # half of the workspace that knows nothing about a window.
      - run: cargo run -p steamgauge-core --example sample-report -- report.html
      - run: node tools/report-check/check.mjs report.html
      # A report of one game has no cross-game matrix and no contents to come back to, so it
      # is a different page and gets driven too.
      - run: cargo run -p steamgauge-core --example sample-report -- one.html --one-game
      - run: node tools/report-check/check.mjs one.html
      # A census of a genre is dozens of games, and that is where the cross-game table stops
      # fitting on a screen at all. Four games never exercise it.
      - run: cargo run -p steamgauge-core --example sample-report -- many.html --games 36
      - run: node tools/report-check/check.mjs many.html
      # The adjudication page is the only place a person's judgement enters the project, and
      # every figure that can be called accuracy rather than agreement will rest on it. A
      # shortcut that does nothing or an answer that does not survive a reload would be found
      # after somebody had read a thousand claims, which is exactly too late.
      - run: cargo run -p steamgauge-core --example sample-gold -- gold.html
      - run: node tools/gold-check/check.mjs gold.html
