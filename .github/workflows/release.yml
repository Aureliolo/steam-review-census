name: release

# Dispatching this builds, checksums, attests and signs exactly as a real release does, but
# publishes nothing: the release step is gated on a tag push. That keeps the pipeline
# testable without spending a version number on finding out whether it works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # DirectML reaches NVIDIA, AMD and Intel through DX12 for ~18 MB, so Windows gets
          # GPU support for every vendor. macOS gets CoreML. Linux ships CPU-only: its GPU
          # option is CUDA, which is NVIDIA-only and would add roughly 750 MB.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: steamgauge
            asset: steamgauge-x86_64-unknown-linux-gnu
            features: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: steamgauge.exe
            asset: steamgauge-x86_64-pc-windows-msvc
            features: "--features directml"
          # Apple Silicon only: ONNX Runtime publishes no prebuilt binary for Intel macOS,
          # and building it from source in CI is not worth it for a platform Apple has
          # stopped shipping.
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: steamgauge
            asset: steamgauge-aarch64-apple-darwin
            features: "--features coreml"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin steamgauge ${{ matrix.features }}

      # Windows binaries gain a SignPath Foundation signature once the project is enrolled.
      # macOS has no free certificate authority, so those assets carry provenance only and
      # Gatekeeper will require an explicit override. SECURITY.md explains the difference.

      # Archived rather than shipped bare: the GPU backends need runtime libraries beside
      # the binary (DirectML.dll on Windows), and a lone executable would not start.
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p "staging/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${{ matrix.asset }}/"
          find "target/${{ matrix.target }}/release" -maxdepth 1 \
            \( -name '*.dll' -o -name '*.dylib' -o -name '*.so' -o -name '*.so.*' \) \
            -exec cp {} "staging/${{ matrix.asset }}/" \;
          tar -C staging -czf "staging/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          rm -rf "staging/${{ matrix.asset }}"
          ls -la staging/

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: build-*
          merge-multiple: true

      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: staging/sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json

      # Checksums are generated after every other asset exists, so they cover the SBOM too.
      - name: Generate checksums
        working-directory: staging
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: staging/steamgauge-*.tar.gz

      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums with cosign
        working-directory: staging
        run: cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.cosign.bundle

      # Proves the chain actually verifies, rather than only that the signing step exited 0.
      - name: Verify provenance and signature
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: staging
        run: |
          for asset in steamgauge-*.tar.gz; do
            gh attestation verify "$asset" --repo "${{ github.repository }}"
          done
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check SHA256SUMS

      - name: Summarise
        working-directory: staging
        run: |
          {
            echo "### Release assets"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo
              echo "Dry run: nothing was published. Push a \`v*\` tag to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Assets are attached in the same call that creates the release: an immutable release
      # locks its assets, so nothing can be added afterwards.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" staging/* --generate-notes --verify-tag
