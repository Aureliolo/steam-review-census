[package]
name = "census-core"
description = "Corpus ingestion, storage and analysis for steam-review-census."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
arrow = "59.3.0"
parquet = "59.3.0"
percent-encoding = "2.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
