[workspace]
resolver = "3"
members = ["crates/census-core", "crates/census-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Aureliolo/steam-review-census"
authors = ["Aurelio <19254254+Aureliolo@users.noreply.github.com>"]

[workspace.dependencies]
census-core = { path = "crates/census-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
